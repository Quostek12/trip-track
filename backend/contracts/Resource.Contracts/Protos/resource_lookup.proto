syntax = "proto3";

option csharp_namespace = "Contracts.ResourceLookup";
    
package resource.v1;

service ResourceLookup {
  rpc Exists (ResourceExistsRequest) returns (ResourceExistsResponse);
  rpc GetSummary (ResourceSummaryRequest) returns (ResourceSummaryResponse);
}    

message ResourceExistsRequest {
  string resource_id = 1;
}

message ResourceExistsResponse {
  bool exists = 1;
  ResourceStatus status = 2;
}

message ResourceSummaryRequest {
  string resource_id = 1;
}

message ResourceSummaryResponse {
    string resource_id = 1;
    string name = 2;
    ResourceStatus status = 3;
    ResourceType type = 4;
}

enum ResourceStatus {
  RESOURCE_STATUS_AVAILABLE = 0;
  RESOURCE_STATUS_IN_USE = 1;
  RESOURCE_STATUS_CONSUMABLE = 2;
}

enum ResourceType {
  RESOURCE_TYPE_TOOL = 0;
  RESOURCE_TYPE_CAR = 1;
  RESOURCE_TYPE_CONSUMABLE = 2;
}